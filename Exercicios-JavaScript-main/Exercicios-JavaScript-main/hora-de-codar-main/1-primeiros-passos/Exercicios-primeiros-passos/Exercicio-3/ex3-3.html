    <script>
        // Exercicio 3.3 = Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).
        
        let n = 0
        var inicio = 15
        var v = 0
        for (let i = inicio; i < 100; i++) {
            n +=inicio;
            inicio++;
            v++;
        }

        let resultado = n / v;

        alert(resultado)
        
    </script>
