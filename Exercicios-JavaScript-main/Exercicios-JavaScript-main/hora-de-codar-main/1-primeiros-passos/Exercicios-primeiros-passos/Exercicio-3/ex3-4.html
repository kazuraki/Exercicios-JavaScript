<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

      //Exercicio 3.4 = Leia dois inteiros (sendo o primeiro menor que o segundo) e calcule a média desses números e de todos os inteiros entre eles.

        let n1 = parseInt(prompt("Escreva um numero: "));
        let n2 = parseInt(prompt("Escreva um numero: "));

        while(n1 >= n2){
            n1 = parseInt(prompt("Escreva outro numero"));

        }
        
        let n = 0;
        let v = 0;

        for (let i = n1; i <= n2; i++){
            n += n1;
            n1++;
            v++;
        }

        let resultado = n /v;
        alert(resultado);

    </script>
</head>
