    <script>
        //Exercicio 3.7 = Leia um valor `N` (N > 0) e imprima todos os inteiros de 1 até `N`.

        let n = parseInt(prompt("Escreva um numero: "));

        while(n < 0 || isNaN(n)){
            n = parseInt(prompt("Escreva outro numero: "));
        }

        for(let i = 1; i < n; i++){
            console.log(i);

        }

        console.log(n)
        
    </script>
