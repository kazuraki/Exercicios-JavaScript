<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Exercicio 3.6 = Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.

        let soma = 0;

        for (let i = 0; i < 6; i++){
            
            let n = parseFloat(prompt("Escreva um numero: "));

            while(n < 0 || n > 10){
                
                n = parseFloat(prompt("nota invalida, insira outro: "));

            }
                soma+= n;
            }
    

        let resultado = soma/6;

        alert(resultado);



    </script>
