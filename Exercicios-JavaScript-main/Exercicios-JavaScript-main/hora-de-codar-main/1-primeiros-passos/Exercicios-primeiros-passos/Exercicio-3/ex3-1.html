    <script>

        //- Permita ao usuário escolher o valor inicial da contagem regressiva.
        
        let timer = parseFloat(prompt("Escolha o tempo da bomba: "));
        for (let i = timer ; i > 0; i--){
            console.log("A bomba vai explodir em: " + i);
        }
        console.log("EXPLOSÃO");
