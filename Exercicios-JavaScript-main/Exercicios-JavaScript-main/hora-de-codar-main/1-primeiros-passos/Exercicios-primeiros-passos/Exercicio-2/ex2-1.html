    <title>Document</title>
    <script>
         //Exercicio 2.1 = Exiba o maior numero
        
        var num1 = prompt("Escreva um numero: ")
        var num2 = prompt("Escreva outro numero: ")

        if(num1 > num2){
            alert("O maior numero é: "+ num1);
            alert("O menor numero é: " + num2);
        } else if(num1 < num2){
            alert("O maior numero é "+ num2);
            alert("O menor numero é " + num1);
        }
    </script>
