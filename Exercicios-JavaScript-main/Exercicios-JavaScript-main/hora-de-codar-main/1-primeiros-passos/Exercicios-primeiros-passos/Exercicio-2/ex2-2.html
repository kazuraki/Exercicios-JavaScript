    <script>
        //Exercicio 2.2 = Exiba se o numero é positivo, negativo ou zero
        
        var num = prompt("Escreva um numero: ")

        if(num > 0 ){
            alert("Positivo")
        } else if(num < 0){
            alert("Negativo")
        }else{ 
            alert("0")
        }
    </script>
