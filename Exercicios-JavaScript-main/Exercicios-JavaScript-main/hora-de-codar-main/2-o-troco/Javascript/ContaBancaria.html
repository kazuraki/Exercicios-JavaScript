<html>

<head>

	<script>

	    // Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.
    
		var saldo = 100.5; // Float (Número com ponto flutuante)
		let senha = "3589";

		let nome = prompt("Escreva seu nome: ");
		alert("Ola " + nome + " é um prazer ter você por aqui!");
		
		/*  Função principal. */
		function inicio() {

			let escolha = parseInt(prompt('Selecione uma opção \n1.) Saldo \n2.) Extrato \n3.) Saque \n4.) Deposito \n5.) Transferencia \n6.)Sair'));
			
			switch(escolha){
			case 1 :
				ver_saldo();
				break;
			case 2: 
				ver_extrato();
				break;
			 case 3: 
				fazer_saque();
				break;
			case 4:
				fazer_deposito();
				break;
			case 5: 
				fazer_transferencia();
				break;
			 case 6: 
				sair();
				break;
			default:  
				erro();
			}
		}

		/*  Função principal. */
		function ver_saldo() {

			senha = prompt("Digite a senha: ")

			if(senha != "3589"){
				alert("Senha incorreta, tente novamente!");
				ver_saldo();
				return
			}else{

			alert('Seu saldo atual é: ' + saldo);
			inicio();
			}
		}

		function ver_extrato(){
			senha = prompt("Digite a senha: ")

			if(senha != "3589"){
				alert("Senha incorreta, tente novamente!");
				ver_extrato();
				return
			}

			alert('Ultima compra: 700 R$ - mouse gamer positivo');
			inicio();
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			senha = prompt("Digite a senha: ")

			if(senha != "3589"){
				alert("Senha incorreta, tente novamente!");
				fazer_saque();
				return
			}

			var saque = parseFloat(prompt('Qual o valor para saque?'));
			if( isNaN(saque)|| saque > saldo ||saque <= 0 ){
				alert("Operação não autorizada")
				inicio();

			} else {
				saldo -= saque;
				ver_saldo();
			}
		}
	

	/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			senha = prompt("Digite a senha: ")

			if(senha != "3589"){
				alert("Senha incorreta, tente novamente!");
				fazer_deposito();
				return
			}
			var deposito = parseFloat(prompt('Qual o valor para depósito?')); 
			// Not a Number
			while (isNaN(deposito)) { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				deposito = parseFloat(prompt('Qual o valor para depósito?'));

			}if( deposito <= 0){
				alert("Operação não autorizada");
				fazer_deposito();
			} 
			else{
				saldo += deposito;
				ver_saldo();
			}
		}

		function fazer_transferencia(){
			senha = prompt("Digite a senha: ")

			if(senha != "3589"){
				alert("Senha incorreta, tente novamente!");
				fazer_transferencia();
				return
			}
			let nConta = parseInt(prompt("Digite o numero da conta: "));
			

			while(isNaN(nConta)){
				nConta = parseInt(prompt("Numero de conta indisponivel, digite novamente: "));			
			}
			let transferir = parseFloat(prompt("Qual o valor a ser transferido: "));
			if(transferir <=  0 || saldo <= 0 || transferir > saldo){
				alert("Operação não autorizada");
				fazer_transferencia();

			}else{

			saldo -= transferir;

			alert("Transferencia realizada com sucesso")
			inicio();
			}
		}

		/* Verificar se há um erro */
		function erro() {
			alert('Por favor, tente novamente e informe um número entre 1 a 6');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				alert("Obrigado " + nome + " foi um prazer ter você por aqui!");
				window.close();
			} else {
				inicio();
			}
		}



		inicio();
	</script>
</head>
